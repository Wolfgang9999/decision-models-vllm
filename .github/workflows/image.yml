name: image
on:
  push:
    branches: [main, release-v2, hopper-fa3]
    paths: [Dockerfile, overlay/**, install_overlay.py, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the vLLM base image is about 11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          PIN=$(python3 -c "import json; print(json.load(open('overlay/manifest.json'))['vllm_commit'])")
          # :latest only from main; other branches get :<branch> (e.g. :hopper-fa3).
          if [ "$GITHUB_REF_NAME" = main ]; then MOVING=latest; else MOVING=${GITHUB_REF_NAME//\//-}; fi
          docker build -t $IMAGE:$MOVING -t $IMAGE:vllm-${PIN:0:9}-${GITHUB_SHA::7} .
          docker run --rm --entrypoint python3 $IMAGE:$MOVING -c "import vllm.model_executor.models.qwen3_5_slot, vllm.v1.core.sched.prefix_lm_scheduler; print('overlay import ok')"
          docker inspect --format 'entrypoint={{json .Config.Entrypoint}}' $IMAGE:$MOVING
          docker push --all-tags $IMAGE
